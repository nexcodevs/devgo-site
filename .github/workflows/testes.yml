# Fluxo de publicação:
#   1. Toda alteração entra na branch `revisao`.
#   2. Esta ação roda a suíte completa (tipos, lint, API e ponta a ponta).
#   3. Só se tudo passar, ela avança a `main` para o mesmo commit, e a Vercel publica.
# Assim nada chega à produção sem passar nos testes, sem depender de configurações extras.
name: Testes

on:
  push:
    branches: [main, revisao]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  publicar:
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/revisao'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Avança a main para o commit testado (só avanço direto, nunca sobrescreve)
        run: git push origin HEAD:main
